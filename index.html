<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idol Cam</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Idol Cam</h1>
        </header>

        <main class="camera-stage">
            <div class="viewport" id="viewport">
                <video id="camera-feed" autoplay playsinline muted></video>
                <img id="idol-overlay" src="" alt="Idol Overlay" crossorigin="anonymous">
            </div>
            <canvas id="capture-canvas" style="display: none;"></canvas>
        </main>

        <footer class="controls">
            <div class="control-group">
                <label for="idol-upload" class="btn secondary-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                </label>
                <input type="file" id="idol-upload" accept="image/*" hidden>
            </div>

            <div class="control-group slider-group">
                <input type="range" id="size-slider" min="10" max="200" value="80" class="size-slider">
            </div>

            <button id="capture-btn" class="capture-btn">
                <div class="inner-circle"></div>
            </button>

            <div class="control-group">
                <button id="switch-cam-btn" class="btn secondary-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6" />
                        <path d="M1 20v-6h6" />
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                    </svg>
                </button>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
